<section class="habitations-carousel">
  <div class="habitations-carousel__viewport">
    <div class="habitations-carousel__track">
      <div class="habitations-carousel__slide">
        <img
          src="./img/habitations/geodesic-dome.jpeg"
          alt="Geodesic Dome"
        />
      </div>
      <div class="habitations-carousel__slide">
        <img
          src="./img/habitations/big-glamping-tent.webp"
          alt="Big Glamping Tent"
        />
      </div>
      <div class="habitations-carousel__slide">
        <img
          src="./img/habitations/wood-cabins.jpeg"
          alt="Wood Cabins"
        />
      </div>
      <div class="habitations-carousel__slide">
        <img
          src="./img/habitations/retro-luxury-tent.webp"
          alt="Retro Luxury Tent"
        />
      </div>
      <div class="habitations-carousel__slide">
        <img
          src="./img/habitations/balloon-tent.webp"
          alt="Balloon Tent"
        />
      </div>
      <div class="habitations-carousel__slide">
        <img
          src="./img/habitations/glamping-tent.webp"
          alt="Glamping Tent"
        />
      </div>
    </div>
  </div>

  <button
    class="habitations-carousel__button habitations-carousel__button--prev"
    type="button"
    aria-label="Previous slide"
  >
    <span class="habitations-carousel__button-icon"></span>
  </button>

  <button
    class="habitations-carousel__button habitations-carousel__button--next"
    type="button"
    aria-label="Next slide"
  >
    <span class="habitations-carousel__button-icon"></span>
  </button>
</section>
